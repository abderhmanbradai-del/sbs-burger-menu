<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBS Burger – Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#0d0d0d;--page:#151311;--ink:#f6efe6;--mute:#b9ada0;--acc:#f26a1b;--line:#3a332c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--page:#151311;--ink:#f6efe6;--mute:#b9ada0;--acc:#f26a1b;--line:#3a332c}}
:root[data-theme="dark"]{--bg:#0d0d0d;--page:#151311;--ink:#f6efe6;--mute:#b9ada0;--acc:#f26a1b;--line:#3a332c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#book{width:min(98vw,1000px);height:min(calc(100vh - 10rem),780px)}
@supports (height:100dvh){#book{height:min(calc(100dvh - 10rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),780px)}}
.pg{background:var(--page);overflow:hidden;container-type:size}
.in{width:100%;height:100%;box-sizing:border-box;padding:5.5% 6%;font-size:clamp(8px,min(2.9cqw,1.85cqh),15px);line-height:1.25;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#1b1815,var(--page) 40%)}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:3.1em;margin:0 0 .6em;padding-bottom:.2em;border-bottom:2px solid var(--acc);color:var(--acc);letter-spacing:.02em;line-height:1}
.ft{margin-top:auto;padding-top:.6em;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.8em;letter-spacing:.06em}
h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.9em;margin:.9em 0 .3em;color:var(--acc);line-height:1}
.it{margin-bottom:.55em}
.r{display:flex;align-items:baseline;gap:.4em}
.r b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.45em;letter-spacing:.02em}
.r i{flex:1;border-bottom:1px dotted var(--mute);transform:translateY(-.2em)}
.r em{font-style:normal;font-weight:600;color:var(--acc);white-space:nowrap}
.it p{margin:0;color:var(--mute);font-size:.86em}
.new{font-size:.7em;background:var(--acc);color:#111;padding:0 .4em;border-radius:3px;font-family:Barlow,sans-serif;font-weight:600}
.cover{justify-content:center;align-items:center;text-align:center;border:1px solid var(--acc);outline:1px solid var(--line);outline-offset:-.9em}
.cover .lg{width:56%;height:auto;border-radius:50%;box-shadow:0 0 0 .45em var(--page),0 0 0 .6em var(--acc);margin-bottom:1.6em}
.ph{display:block;width:100%;aspect-ratio:16/10;max-height:38cqh;object-fit:cover;border-radius:.6em;border:1px solid var(--line)}
.cap{margin:.7em 0 0;color:var(--mute);font-size:.95em}
.fl{width:1.7em;height:1.7em;border-radius:50%;vertical-align:middle;margin-right:.5em}
.cover .big{font-family:'Bebas Neue',Impact,sans-serif;font-size:9em;line-height:.9;color:var(--ink)}
.cover .big span{color:var(--acc)}
.cover .sub{font-family:'Bebas Neue',Impact,sans-serif;font-size:3em;letter-spacing:.35em;color:var(--acc);padding-left:.35em}
.cover p{color:var(--mute);margin:1.5em 0 0;font-size:1.1em}
.cover .hint{margin-top:2.5em;font-size:.95em}
.box{display:flex;gap:.6em}.box .it{flex:1;border:1px solid var(--line);padding:.5em;border-radius:6px;text-align:center}
.box .it b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.5em;display:block}
.box .it em{font-style:normal;color:var(--acc);font-weight:600}
.kid{border:1px solid var(--acc);border-radius:6px;padding:.6em .8em;margin-top:.4em}
#bar{display:flex;align-items:center;gap:.4rem;padding:.6rem .8rem;margin-bottom:.8rem;background:#1d1a17;border:1px solid var(--line);border-radius:12px}
#bar button{background:none;border:0;color:var(--ink);font-size:1.4rem;width:2.6rem;height:2.6rem;border-radius:8px;cursor:pointer}
#bar button:focus-visible{outline:2px solid var(--acc)}
#bar button:hover{background:#2a2622}
#cnt{min-width:4.5rem;text-align:center;font-weight:600;color:var(--mute)}
#tabs{width:100%;box-sizing:border-box;display:flex;justify-content:safe center;gap:.4rem;overflow-x:auto;padding:.7rem .8rem .3rem;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:#1d1a17;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font:600 .95rem Barlow,Arial,sans-serif;cursor:pointer}
#tabs button:focus-visible{outline:2px solid var(--acc)}
#tabs button.on{background:var(--acc);border-color:var(--acc);color:#111}
</style>
</head>
<body>
<nav id="tabs" aria-label="Catégories"></nav>
<div id="stage"><div id="book"></div></div>
<div id="bar" role="toolbar" aria-label="Navigation du menu">
<button id="prev" aria-label="Page précédente">‹</button>
<span id="cnt">1 / 9</span>
<button id="next" aria-label="Page suivante">›</button>
<button id="fs" aria-label="Plein écran">⛶</button>
<button id="sh" aria-label="Partager">⤴</button>
</div>
